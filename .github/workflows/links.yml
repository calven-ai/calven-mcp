name: Check links

on:
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 401 and 403 are failures: they hide pages that moved behind a login or were removed.
      # URLs that answer 401 by design (the MCP endpoint) are listed in .lycheeignore with the reason.
      # 429 is not accepted either; the action passes GITHUB_TOKEN for github.com links, and
      # retries with a longer wait absorb short rate limits.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,204,206,301,302,307,308
            --max-retries 3
            --retry-wait-time 10
            --exclude-path node_modules
            './**/*.md'
          fail: true
