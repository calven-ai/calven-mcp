name: Publish to MCP Registry

# Manual only. Registry versions are immutable, so a person decides when to publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: authenticate and validate, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-registry
  cancel-in-progress: false

env:
  REGISTRY_URL: https://registry.modelcontextprotocol.io
  SERVER_NAME: ai.calven/mcp
  DNS_DOMAIN: calven.ai
  KEY_VAULT_NAME: calven-internal01-kv
  KEY_VAULT_SECRET: mcp-registry-signing-key
  MCP_PUBLISHER_VERSION: 1.8.1
  # sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.1_checksums.txt
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  # Runs without secrets or an environment, so a bad ref or version fails
  # before anyone is asked to approve the publish job.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publishing runs only from refs/heads/$DEFAULT_BRANCH (got $REF)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate

      - name: Check manifest versions match
        id: version
        run: |
          set -euo pipefail
          server_version="$(jq -er '.version' server.json)"
          plugin_version="$(jq -er '.version' plugin.json)"
          if [ "$server_version" != "$plugin_version" ]; then
            echo "::error::server.json version ($server_version) does not match plugin.json version ($plugin_version)."
            exit 1
          fi
          echo "version=$server_version" >> "$GITHUB_OUTPUT"

      - name: Check version is not already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          encoded_name="${SERVER_NAME//\//%2F}"
          url="$REGISTRY_URL/v0/servers/$encoded_name/versions/$VERSION"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
          message="$SERVER_NAME $VERSION is already published. Registry versions are immutable; bump server.json and plugin.json."
          case "$status" in
            404) echo "$SERVER_NAME $VERSION is not in the registry yet." ;;
            200)
              # A dry run never publishes, so let it continue and exercise auth.
              if [ "$DRY_RUN" = "true" ]; then
                echo "::warning::$message"
              else
                echo "::error::$message"
                exit 1
              fi
              ;;
            *) echo "::error::Unexpected HTTP $status from $url."; exit 1 ;;
          esac

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" mcp-publisher
          rm -f "$archive"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/mcp-publisher" --version

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The key never leaves this step: the hex value lives only in a shell
      # variable and the PEM is deleted before the step ends.
      - name: Log in to the registry with DNS auth
        run: |
          set -euo pipefail
          umask 077
          pem="$RUNNER_TEMP/mcp-registry-key.pem"
          trap 'rm -f "$pem"' EXIT

          az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$KEY_VAULT_SECRET" \
            --query value --output tsv > "$pem"
          while IFS= read -r line; do
            case "$line" in -----*|"") ;; *) echo "::add-mask::$line" ;; esac
          done < "$pem"

          key_text="$(openssl pkey -in "$pem" -noout -text)"
          rm -f "$pem"
          if [[ "$key_text" != "ED25519 Private-Key:"* ]]; then
            echo "::error::Secret $KEY_VAULT_SECRET is not an Ed25519 private key."
            exit 1
          fi

          private_key_hex="$(grep -A3 'priv:' <<<"$key_text" | tail -n +2 | tr -d ' :\n')"
          unset key_text
          echo "::add-mask::$private_key_hex"
          if ! [[ "$private_key_hex" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Derived private key is not 32 bytes of hex."
            exit 1
          fi

          mcp-publisher login dns --domain "$DNS_DOMAIN" --private-key "$private_key_hex"
          unset private_key_hex

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Publish server.json
        if: ${{ !inputs.dry_run }}
        run: mcp-publisher publish server.json

      - name: Summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### MCP Registry: $SERVER_NAME $VERSION"
            echo "Job status: $JOB_STATUS. Dry run: $DRY_RUN."
            if [ "$DRY_RUN" != "true" ]; then
              echo "Registry entry: $REGISTRY_URL/v0/servers/${SERVER_NAME//\//%2F}/versions/$VERSION"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up credentials
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/mcp-registry-key.pem"
          mcp-publisher logout || true
          az logout || true
