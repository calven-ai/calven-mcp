name: Validate public surface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # The tooling lives in scripts/ so the plugin root has no package.json: Claude Code
      # installs a root package.json's packages on every user's machine.
      - run: npm ci --prefix scripts
      - run: npm run validate --prefix scripts
      # Claude Code's own plugin check: manifests, marketplace entry, skills, commands, agents, .mcp.json.
      # Pinned so a CLI release cannot change the verdict unannounced; 2.1.281+ accepts the directory listing fields.
      - run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate . --strict
