name: Smoke production discovery

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ENDPOINT: https://api.calven.ai/mcp
  RESOURCE_METADATA: https://api.calven.ai/.well-known/oauth-protected-resource/mcp

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check protected resource metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(curl --fail --silent --show-error "$RESOURCE_METADATA")"
          jq -e --arg endpoint "$ENDPOINT" '.resource == $endpoint' <<<"$metadata"
          jq -e '.authorization_servers | length > 0' <<<"$metadata"

      # Legacy clients (protocol 2025-11-25 and earlier) start with an initialize handshake.
      - name: Check anonymous bearer challenge (2025-11-25 initialize)
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"calven-public-smoke","version":"1.0.0"}}}' \
            "$ENDPOINT")"
          echo "HTTP $status"
          test "$status" = "401"
          challenge="$(tr -d '\r' < "$headers" | grep -i '^www-authenticate:' | head -1)"
          echo "$challenge"
          grep -qF "resource_metadata=\"$RESOURCE_METADATA\"" <<<"$challenge"

      # Protocol 2026-07-28 has no initialize: every request carries MCP-Protocol-Version and
      # Mcp-Method headers plus the protocol version, client info, and capabilities in params._meta.
      - name: Check anonymous bearer challenge (2026-07-28 tools/list)
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2026-07-28' \
            --header 'Mcp-Method: tools/list' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"calven-public-smoke","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
            "$ENDPOINT")"
          echo "HTTP $status"
          test "$status" = "401"
          challenge="$(tr -d '\r' < "$headers" | grep -i '^www-authenticate:' | head -1)"
          echo "$challenge"
          grep -qF "resource_metadata=\"$RESOURCE_METADATA\"" <<<"$challenge"
