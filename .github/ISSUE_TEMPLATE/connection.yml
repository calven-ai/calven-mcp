name: Connection problem
description: Report a client setup, sign-in, discovery, or compatibility failure. Not for security vulnerabilities.
title: "[Connection]: "
labels: [connection]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a client cannot be set up, cannot sign in, or cannot discover or call the server.

        Anything security-sensitive belongs in the private channel in [SECURITY.md](https://github.com/calven-ai/calven-mcp/blob/main/SECURITY.md), not here. That includes an authentication bypass, token or key leakage, cross-tenant access, or a report that needs customer data to explain.

        Do not include an access token, customer name, tenant identifier, or private workspace content.
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Claude Code 1.2.3
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: server-url
    attributes:
      label: Server URL you added
      placeholder: https://api.calven.ai/mcp
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where it failed
      options:
        - Adding the server
        - Browser sign-in
        - Consent
        - Tool list
        - Tool call
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the stage that failed and redacted output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
