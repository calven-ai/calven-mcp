schema_version: "1.1"
name: customer-evidence-1
description: Routing. This request should load customer-evidence and no other Calven skill.
tags: [routing]
runs: 2
execution:
  max_turns: 20
  allowed_tools: [Skill, Agent]
  prompt: |-
    Find me customer quotes about lineage I can use on a launch slide.
graders:
  - name: no-other-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(battlecard|deal-prep|quality-review|persona-copy-review|on-message-draft|icp-check|icp-pipeline-review|win-loss-review|market-research|product-intelligence|gtm-overview|start)"'
    min: 0
    max: 0
    arm: both
  - name: right-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(customer-evidence)"'
    arm: both
