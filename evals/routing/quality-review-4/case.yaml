schema_version: "1.1"
name: quality-review-4
description: Routing. This request should load quality-review and no other Calven skill.
tags: [routing]
runs: 2
execution:
  max_turns: 20
  allowed_tools: [Skill, Agent]
  prompt: |-
    Can you QA this landing page hero before we ship it? Is it accurate and on message? "Northwind Observe: catch broken data before your stakeholders do. Column-level lineage for Snowflake, BigQuery and Databricks."
graders:
  - name: no-other-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(battlecard|deal-prep|persona-copy-review|on-message-draft|customer-evidence|icp-check|icp-pipeline-review|win-loss-review|market-research|product-intelligence|gtm-overview|start)"'
    min: 0
    max: 0
    arm: both
  - name: right-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(quality-review)"'
    arm: both
