schema_version: "1.1"
name: market-research-1
description: Routing. This request should load market-research and no other Calven skill.
tags: [routing]
runs: 2
execution:
  max_turns: 20
  allowed_tools: [Skill, Agent]
  prompt: |-
    Which market trends should we be paying attention to this quarter?
graders:
  - name: no-other-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(battlecard|deal-prep|quality-review|persona-copy-review|on-message-draft|customer-evidence|icp-check|icp-pipeline-review|win-loss-review|product-intelligence|gtm-overview|start)"'
    min: 0
    max: 0
    arm: both
  - name: right-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(market-research)"'
    arm: both
