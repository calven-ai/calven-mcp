schema_version: "1.1"
name: on-message-draft-1
description: Routing. This request should load on-message-draft and no other Calven skill.
tags: [routing]
runs: 2
execution:
  max_turns: 20
  allowed_tools: [Skill, Agent]
  prompt: |-
    Write a landing page hero and three bullets for the Head of Data Platform persona, in our approved messaging.
graders:
  - name: no-other-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(battlecard|deal-prep|quality-review|persona-copy-review|customer-evidence|icp-check|icp-pipeline-review|win-loss-review|market-research|product-intelligence|gtm-overview|start)"'
    min: 0
    max: 0
    arm: both
  - name: right-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(on-message-draft)"'
    arm: both
