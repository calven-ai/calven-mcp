schema_version: "1.1"
name: quality-review-launch-email
description: A launch email with five checkable claims, reviewed for accuracy, message and personas. Two are wrong, one is stale, one is unsupported, one is supported.
tags: [quality-review, marketing]
runs: 3
execution:
  max_turns: 20
  allowed_tools: [Skill, Agent]
  prompt: |-
    Can you check this before I send it to our whole list tomorrow?

    "Northwind Observe is the only data observability platform with column-level lineage. It plugs straight into dbt Cloud, Snowflake and BigQuery. Plans start at just $500 a month on Starter, and we're SOC 2 Type II certified. Customers cut data incidents by 70% in their first quarter."
graders:
  - name: persona-review
    type: tool_used
    tool: mcp__plugin_calven_calven__review_against_personas
  - name: read-brief
    type: tool_used
    tool: mcp__plugin_calven_calven__get_strategy_document
    input_match: 'product_brief'
  - name: read-messaging
    type: tool_used
    tool: mcp__plugin_calven_calven__get_strategy_document
    input_match: 'messaging|positioning'
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?quality-review"'
  - name: verdicts
    type: llm
    weight: 3
    criteria: |-
      Ground truth from the fictional workspace: (a) "only ... column-level lineage" is wrong or unsupported (Lattice Data has it; positioning says not to claim "only"); (b) dbt Cloud is wrong (not supported; on the roadmap for Q1 2027), while Snowflake and BigQuery are supported; (c) "$500 a month on Starter" is stale or wrong (Starter retired 2026-09-15; plans start at $1,500/month on Team); (d) SOC 2 Type II is supported; (e) "cut data incidents by 70%" has no source (unsupported). Other true workspace facts the reply may cite: Databricks and dbt Core are supported integrations; Databricks Unity Catalog lineage shipped on 2026-10-05; the only approved proof is the Soylent case study (time-to-detect from 2 days to 40 minutes); a website claim that "only" Northwind has column-level lineage is already flagged because Lattice Data has offered it since 2025; the persona review returns fixed findings that do not exactly match this email: VP Finance (high) wants forecastable pricing, Analytics Engineer (medium) says dbt is not mentioned, Head of Data Platform (low) says "catch broken data" lands. Reporting these, with or without a caveat about the mismatch, is fine. Judge only claims (a) to (e) for PASS or FAIL.
      PASS if the reply flags (a), (b) and (c) as problems, does not call (d) false, and flags (e) as unsupported or unverifiable. Each flagged claim should come with corrected wording or the source.
      FAIL if any of (a), (b), (c) or (e) is accepted as fine, or if the reply marks the SOC 2 Type II claim wrong or unsupported. A wording suggestion on a supported claim (such as "audited" for "certified") is fine.
