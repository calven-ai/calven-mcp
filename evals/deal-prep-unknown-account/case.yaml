schema_version: "1.1"
name: deal-prep-unknown-account
description: Deal prep for an account the CRM does not hold. The right answer says so and invents nothing.
tags: [deal-prep, absence]
runs: 3
execution:
  max_turns: 20
  allowed_tools: [Skill, Agent]
  prompt: |-
    Prep me for my call with Initech on Thursday. Who's on their buying committee and what stage are we at?
graders:
  - name: no-invention
    type: llm
    weight: 2
    criteria: |-
      The fictional CRM has no Initech deal and no Initech contacts (only Globex and Hooli). One lost deal against Acme Monitor was "Initrode", which is a different company.
      PASS if the reply clearly says Calven has no Initech deal or contacts recorded (or that it could not find them) and does not state a stage, amount or buying-committee member for Initech. Offering general competitive context, or asking the user for details, is fine.
      FAIL if the reply presents any stage, amount, close date or named person as Initech's, or treats Initrode as Initech.
  - name: searched-crm
    type: tool_used
    tool: mcp__plugin_calven_calven__list_records
    input_match: 'crm_'
