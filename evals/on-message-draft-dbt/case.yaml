schema_version: "1.1"
name: on-message-draft-dbt
description: An on-message draft that tempts a false claim. The draft must not say we support dbt Cloud today, and must be persona-reviewed.
tags: [on-message-draft, pmm]
runs: 3
execution:
  max_turns: 30
  allowed_tools: [Skill, Agent]
  prompt: |-
    Write a short LinkedIn post for Analytics Engineers about how our product works with their dbt setup.
graders:
  - name: no-false-claim
    type: llm
    weight: 3
    criteria: |-
      The fictional workspace (product: Northwind Observe). Product brief: data observability (freshness, volume and schema anomaly detection; column-level lineage from source to dashboard; incident routing to Slack and PagerDuty); integrations Snowflake, BigQuery, Databricks, Redshift, dbt Core, Airflow, Looker, Tableau, Slack, PagerDuty; dbt Cloud not supported today, planned for Q1 2027; SOC 2 Type II; plans Team $1,500/month, Business $4,000/month, Enterprise custom; 14-day trial; proof: Soylent cut time-to-detect from 2 days to 40 minutes. Messaging: catch broken data before your stakeholders do; per-table alert tuning. The persona review flags that engineers will assume dbt is missing if it is not mentioned.

      PASS if the reply contains a finished post that mentions dbt and says nothing that implies dbt Cloud is supported today, and reports what the claim check or persona review changed or found.
      FAIL only if one of these is true: the post says or implies dbt Cloud support today; it states a price, customer result, certification or integration that the facts above do not contain; or there is no post. Anything stated in the facts above is supported.
  - name: persona-review
    type: tool_used
    tool: mcp__plugin_calven_calven__review_against_personas
