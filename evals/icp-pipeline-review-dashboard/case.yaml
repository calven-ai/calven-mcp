schema_version: "1.1"
name: icp-pipeline-review-dashboard
description: The ICP pipeline review. Ratios must stay ratios, the two clocks must not be mixed, small samples must be flagged.
tags: [icp-pipeline-review, revops, dashboard]
runs: 3
execution:
  max_turns: 25
  timeout_seconds: 480
  allowed_tools: [Skill, Agent]
  prompt: |-
    Is our pipeline actually on ICP? Build me the ICP pipeline dashboard for Monday's sales leadership sync.
graders:
  - name: numbers
    type: llm
    weight: 3
    criteria: |-
      Everything the fictional workspace returns for the ICP dashboard, last 12 months (2025-10-01 to 2026-09-30) against the 12 months before: ICP share of wins 71% on n=24 (from 62% on n=21); ICP-fit share of open pipeline 58% of $1,240,000 open today (snapshot, not compared); deal size lift 1.6x on n=31 (in-ICP average $86,000, out-of-ICP $54,000; prior 1.4x); sales cycle 74 days on n=17 (from 81); win rate baseline 39% on n=44; 300-5,000 employees 52% on n=23; trigger "data incident reached an executive report" 64% on n=11; dbt Cloud users 22% on n=9 (below floor); best segment fintech 300-5,000 employees 58% on n=12 (expand); Logistics software Europe 60% on n=5 (below floor); over 5,000 employees 18% on n=11 (deprioritize, $310,000 open); segment detail (sample floor 10 deals): fintech 300-5,000 employees North America avg deal $92,000, open pipeline $210,000, avg fit 0.81; Logistics software 300-5,000 Europe avg deal $78,000, open $84,000, avg fit 0.88; over 5,000 employees avg deal $64,000, avg fit 0.42; ICP means fit tiers 1 and 2; trigger lift 1.64; fit tiers 14, 22, 31 and 18 accounts (ICP document version 3); on-ICP pipeline $640,000, $690,000, $720,000 and off-ICP $420,000, $480,000, $520,000 for July to September 2026. The ICP document already names the trigger "a data incident reached an executive report". The ICP: 300 to 5,000 employees, data platform team of 3+, cloud warehouse; no industry named. CRM rows: open deals Globex Platform rollout ($84,000, Proposal, close 2026-11-20) and Hooli Pilot ($30,000, Discovery); accounts Globex (1,200 employees, fit tier A) and Hooli (8,000 employees, tier B).

      PASS if the reply gives the 71% ICP share of wins with n=24, the 58% ICP-fit share of open pipeline, the deal size lift as a ratio (1.6x or 1.6 times), and marks at least one of the small samples (Logistics software n=5, dbt Cloud n=9) as small or directional. Any layout is fine, and so is a note that a live page could not be published here.
      FAIL only if one of these is true: it states the deal size lift as a dollar amount; it gives 71%, 58%, n=24 or 1.6 as a different value; or it proposes adding the data-incident trigger to the ICP as a new criterion.
  - name: read-icp
    type: tool_used
    tool: mcp__plugin_calven_calven__get_insights
    input_match: '"dashboard"\s*:\s*"icp"'
